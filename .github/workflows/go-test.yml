name: Go
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Install dependencies
        run: go get ./backend
      - name: Build
        run: go build -v ./backend/...
      - name: Running unit and integration tests
        run: go test ./backend/... -tags=integration -v
