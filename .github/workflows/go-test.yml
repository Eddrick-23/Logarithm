name: Go
on:
  push:
    branches:
      - main
  pull_request:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        run: go build -v ./...
      - name: Running unit and integration tests
        working-directory: backend
        run: go test ./... -tags=integration -v
