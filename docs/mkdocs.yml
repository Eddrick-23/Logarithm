site_name: Logarithm
site_url: https://mydomain.org/mysite

nav:
  - Home: index.md
  - Configuration: 
    - Environment Variables: environment.md
    - NATS: nats_config.md
    - Clickhouse: clickhouse_config.md
  - Integration with OpenTelemetry: otel.md
  - Infrastructure: 
      - Clickhouse: clickhouse.md

theme:
  name: material
  features:
    - content.code.annotate
    - content.code.copy
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: indigo
      accent: indigo
    # Light Mode
    - scheme: default 
      toggle:
        icon: material/weather-night
        name: Dark mode
      primary: indigo
      accent: indigo
  icon:
    annotation: material/plus-circle

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg 
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences
