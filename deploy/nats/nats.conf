listen: 0.0.0.0:4222
http_port: 8222

jetstream {
  store_dir: "/data"

  # 1GB
  max_memory_store: 1073741824

  # 10GB
  max_file_store: 10737418240
}

websocket {
    host: "localhost"
    port: 443

    # TLS is disabled for test environments
    # TODO: enable it for production
    no_tls: true
    compression: true
}
